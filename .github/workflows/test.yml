name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The game itself has no dependencies, but the audio tests render the
      # station through node-web-audio-api, so the devDependency has to be here.
      - run: npm ci
      - run: npm test
